name: Android

on:
  push:
    # La rama "capturas" solo guarda las imágenes de las capturas automáticas.
    branches-ignore: [capturas]
  pull_request:
  workflow_dispatch:

env:
  TDLIB_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
  TDLIB_ABIS: "arm64-v8a armeabi-v7a"

jobs:
  tdlib:
    name: TDLib (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Caché de TDLib
        id: cache
        uses: actions/cache@v4
        with:
          path: tdlib
          key: tdlib-${{ env.TDLIB_COMMIT }}-${{ hashFiles('scripts/build-tdlib.sh') }}

      - name: Dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gperf php-cli

      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-tdlib.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib
          path: tdlib

  app:
    name: APK
    needs: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tdlib
          path: tdlib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test --stacktrace

      - name: Clave de firma
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin SIGNING_KEYSTORE_BASE64: el APK se firma con una clave de depuración temporal y no se podrá actualizar sin desinstalar."
          fi

      # Versión 0.1.N hasta la compilación 99; desde la 100 sube la del medio cada 100
      # (100 → 0.2.0, 200 → 0.3.0). Igual que versionName en app/build.gradle.kts.
      - name: Versión
        run: |
          n=${{ github.run_number }}
          echo "APP_VERSION=0.$((1 + n / 100)).$((n % 100))" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TOPPORTS_CHANNEL_ID: ${{ secrets.TOPPORTS_CHANNEL_ID || vars.TOPPORTS_CHANNEL_ID }}
          TOPPORTS_CHANNEL_USERNAME: ${{ secrets.TOPPORTS_CHANNEL_USERNAME || vars.TOPPORTS_CHANNEL_USERNAME }}
          TOPPORTS_CHANNEL_INVITE_LINK: ${{ secrets.TOPPORTS_CHANNEL_INVITE_LINK || vars.TOPPORTS_CHANNEL_INVITE_LINK }}
          TOPPORTS_LEGAL_CONTACT: ${{ secrets.TOPPORTS_LEGAL_CONTACT || vars.TOPPORTS_LEGAL_CONTACT }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Nombre claro para el APK en lugar del "app-release.apk" que genera Gradle.
      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/TopPorts-${{ env.APP_VERSION }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TopPorts-${{ env.APP_VERSION }}
          path: dist/*.apk

  # Capturas de la app en 16:9, 16:10, 4:3, 1:1, 8:7, 21:9 y 21:10 (horizontal y vertical) con un
  # catálogo de ejemplo. Tarda unos 15 min: solo al lanzar el workflow a mano (Run workflow).
  screenshots:
    name: Capturas de pantalla
    if: github.event_name == 'workflow_dispatch'
    needs: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tdlib
          path: tdlib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Versión 0.1.N hasta la compilación 99; desde la 100 sube la del medio cada 100
      # (100 → 0.2.0, 200 → 0.3.0). Igual que versionName en app/build.gradle.kts.
      - name: Versión
        run: |
          n=${{ github.run_number }}
          echo "APP_VERSION=0.$((1 + n / 100)).$((n % 100))" >> "$GITHUB_ENV"

      - name: APK de demo
        env:
          VERSION_CODE: ${{ github.run_number }}
          TOPPORTS_DEMO: "true"
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-${{ env.APP_VERSION }}
          path: capturas/

      # También en la rama "capturas" del repositorio: se ven directamente en GitHub, sin
      # descargar el zip (la rama se rehace en cada ejecución).
      - name: Publicar en la rama capturas
        if: always()
        run: |
          [ -d capturas ] && [ -n "$(ls capturas)" ] || exit 0
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas ${{ env.APP_VERSION }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" capturas
